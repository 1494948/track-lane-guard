plugins {
    id 'com.android.application'
}

def webAssetsDir = new File(buildDir, 'generated/web_assets')

android {
    namespace 'cn.xuzf.tlg'
    compileSdk 34

    defaultConfig {
        applicationId 'cn.xuzf.tlg'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '1.6.0'
    }

    // web/ 目录是唯一的前端源码，构建时同步进 assets
    sourceSets {
        main {
            assets.srcDirs += webAssetsDir
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // 自用分发：release 直接复用 debug 签名，省去自建 keystore
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 仅此一个依赖：把 assets 以 https 安全源提供给 WebView，从而允许 getUserMedia
    implementation 'androidx.webkit:webkit:1.8.0'
}

tasks.register('copyWebAssets', Sync) {
    from rootProject.file('../web')
    into webAssetsDir
}

tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
